name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "screenshots/hero.jpg", "screenshots/demo.gif", "data/icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp screenshots/hero.jpg screenshots/demo.gif _site/
          cp data/icons/hicolor/scalable/apps/io.github.techbysakh963.Ajar.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
